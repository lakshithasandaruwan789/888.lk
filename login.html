<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>888.lk - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0b1526; color: #ffffff; font-family: 'Roboto', sans-serif; }
        .header-bg { background-color: #0e1a30; border-bottom: 1px solid #1a2942; }
        .card { background-color: #121e36; border-radius: 8px; }
        .nav-active { color: #ffffff; }
        .nav-inactive { color: #6c757d; }
        .nav-circle { background-color: #0e1a30; border: 4px solid #0b1526; border-radius: 50%; padding: 10px; margin-top: -25px; }
        .input-field { background-color: #0e1a30; border: 1px solid #1a2942; color: white; transition: all 0.2s; }
        .input-field:focus { border-color: #2196f3; outline: none; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen relative pb-20 select-none">

    <!-- Header -->
    <header class="flex justify-between items-center px-4 py-3 header-bg sticky top-0 z-40">
        <div class="text-3xl font-black text-red-500 italic drop-shadow-md tracking-tighter">
            888<span class="text-yellow-400 text-lg font-bold normal-case">.lk</span>
        </div>
    </header>

    <main class="p-4">
        <div class="card p-6 mt-4 shadow-lg">
            <h1 class="text-2xl font-bold text-center mb-6 text-[#2196f3]">Login</h1>
            
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Mobile Number</label>
                    <div class="flex">
                        <span class="input-field rounded-l flex items-center px-3 border-r-0 text-gray-400 font-bold">+94</span>
                        <input id="logMobile" type="tel" required class="input-field rounded-r w-full p-3 font-bold placeholder-gray-600" placeholder="000 000 000">
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Password</label>
                    <input id="logPassword" type="password" required class="input-field rounded w-full p-3 font-bold placeholder-gray-600" placeholder="••••••••">
                </div>

                <button type="submit" class="w-full bg-[#2196f3] text-white py-3 rounded font-bold mt-4 shadow-lg active:scale-95 transition">LOGIN</button>
            </form>
            
            <div class="text-center mt-6 text-sm text-gray-400">
                Don't have an account? <a href="register.html" class="text-[#2196f3] font-bold">Register</a>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto header-bg flex justify-around items-end pb-2 pt-1 z-40 text-[10px] font-bold shadow-[0_-4px_10px_rgba(0,0,0,0.3)]">
        <a href="index.html" class="flex flex-col items-center nav-inactive w-1/4">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="mb-1"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
            HOME
        </a>
        <a href="win.html" class="flex flex-col items-center nav-inactive w-1/4">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="mb-1"><path d="M2.736 10a1 1 0 0 1-.958-1.286l2.1-7A1 1 0 0 1 4.836 1h14.328a1 1 0 0 1 .958.714l2.1 7a1 1 0 0 1-.958 1.286zm17.394 2L12.923 23.364a1.2 1.2 0 0 1-1.846 0L3.87 12z"/></svg>
            WIN
        </a>
        <a href="#" class="flex flex-col items-center nav-inactive w-1/4">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="mb-1"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
            BITGAME
        </a>
        <a href="login.html" class="flex flex-col items-center nav-active w-1/4 relative">
            <div class="nav-circle absolute -top-10 flex items-center justify-center">
                <div class="w-10 h-10 rounded-full bg-[#1a73e8] flex items-center justify-center border-2 border-[#0b1526] text-white"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
            </div>
            <span class="mt-6">MINE</span>
        </a>
    </nav>
    
    <script>
        if (localStorage.getItem('auth_token')) {
            window.location.href = 'index.html';
        }
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const mobile = document.getElementById('logMobile').value;
            const password = document.getElementById('logPassword').value;
            
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mobile, password })
                });
                const data = await res.json();
                if(data.success) {
                    localStorage.setItem('auth_token', data.token);
                    window.location.href = 'index.html';
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert('Server error. Is the server running?');
            }
        });
    </script>
</body>
</html>
