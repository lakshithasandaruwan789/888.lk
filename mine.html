<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>888.lk - Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0b1526; color: #ffffff; font-family: 'Roboto', sans-serif; }
        .card { background-color: #121e36; border-radius: 8px; border: 1px solid #1a2942; }
        .header-bg { background-color: #0e1a30; border-bottom: 1px solid #1a2942; }
        .nav-active { color: #ffffff; }
        .nav-inactive { color: #6c757d; }
        .nav-circle { background-color: #0e1a30; border: 4px solid #0b1526; border-radius: 50%; padding: 10px; margin-top: -25px; }
        
        /* Glassmorphism for profile */
        .glass-panel {
            background: rgba(26, 115, 232, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(26, 115, 232, 0.3);
            border-radius: 12px;
        }
        
        .menu-item:active { background-color: #1a2942; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen relative pb-20 select-none">

    <header class="flex justify-between items-center px-4 py-3 header-bg sticky top-0 z-40">
        <div class="text-xl font-bold">Profile</div>
    </header>

    <main class="p-4 space-y-4">
        <!-- User Info Card -->
        <div class="glass-panel p-5 flex items-center gap-4 relative overflow-hidden">
            <!-- Decorative circle -->
            <div class="absolute -right-6 -top-6 w-24 h-24 bg-blue-500 rounded-full opacity-20 blur-xl"></div>
            
            <div id="avatar-container" class="w-16 h-16 rounded-full bg-gradient-to-br from-blue-400 to-indigo-600 flex items-center justify-center text-white text-2xl font-bold shadow-lg shadow-blue-500/30 overflow-hidden cursor-pointer relative" onclick="document.getElementById('avatar-input').click()">
                <img id="avatar-img" src="" alt="Avatar" class="w-full h-full object-cover hidden">
                <svg id="avatar-placeholder" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
            <input type="file" id="avatar-input" accept="image/*" class="hidden" onchange="uploadAvatar(this)">
            <div>
                <div class="text-2xl font-bold tracking-wider text-white" id="profile-name">User</div>
                <div class="text-gray-300 text-sm mt-1 flex items-center gap-2">
                    <span id="profile-country">Sri Lanka 🇱🇰</span>
                    <span class="text-gray-500">•</span>
                    <span id="profile-mobile">Loading...</span>
                </div>
                <div class="text-xs text-blue-300 mt-2 flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-green-400 inline-block"></span> Active
                </div>
            </div>
        </div>

        <!-- Wallet Card -->
        <div class="card p-5">
            <div class="text-gray-400 text-sm mb-2">Total Balance</div>
            <div class="flex items-center gap-2 mb-6">
                <span class="text-yellow-400 text-2xl">🪙</span>
                <span class="text-3xl font-black tracking-tight" id="profile-balance">0.00</span>
                <span class="text-green-400 font-bold ml-2 text-lg" id="profile-balance-usd">($0.00)</span>
            </div>
            
            <div class="flex gap-3">
                <button onclick="window.location.href='deposit.html'" class="flex-1 bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white font-bold py-3 px-4 rounded-lg shadow-lg shadow-blue-500/30 transition-all flex justify-center items-center gap-2 active:scale-95">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Deposit
                </button>
                <button onclick="window.location.href='withdraw.html'" class="flex-1 bg-[#1a2942] hover:bg-[#233554] text-white font-bold py-3 px-4 rounded-lg transition-all flex justify-center items-center gap-2 border border-[#2a3f63] active:scale-95">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Withdraw
                </button>
            </div>
        </div>

        <!-- Referral Center Card -->
        <div class="card p-5 relative overflow-hidden group">
            <div class="absolute -right-10 -bottom-10 w-32 h-32 bg-purple-500 rounded-full opacity-10 blur-xl group-hover:scale-110 transition-transform"></div>
            <div class="text-gray-400 text-sm mb-3 font-bold flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-purple-400"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                Referral Center
            </div>
            
            <div class="flex items-center justify-between bg-[#0e1a30] p-3 rounded border border-[#1a2942] mb-4">
                <div>
                    <div class="text-xs text-gray-500 mb-1">Your Code</div>
                    <div class="text-xl font-bold tracking-widest text-white" id="ref-code">------</div>
                </div>
                <button onclick="copyReferral()" class="bg-[#1a2942] hover:bg-[#233554] px-4 py-2 rounded text-sm text-blue-400 font-bold border border-[#2a3f63] active:scale-95 transition">
                    Copy Link
                </button>
            </div>
            
            <div class="flex gap-4">
                <div class="flex-1 bg-[#0e1a30] p-3 rounded border border-[#1a2942]">
                    <div class="text-xs text-gray-500">Friends Invited</div>
                    <div class="text-lg font-bold text-white mt-1" id="ref-count">0</div>
                </div>
                <div class="flex-1 bg-[#0e1a30] p-3 rounded border border-[#1a2942]">
                    <div class="text-xs text-gray-500">Total Bonus</div>
                    <div class="text-lg font-bold text-green-400 mt-1 flex items-center gap-1">
                        🪙 <span id="ref-earnings">0</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Menu List -->
        <div class="card overflow-hidden">
            <div class="menu-item p-4 border-b border-[#1a2942] flex items-center justify-between cursor-pointer" onclick="window.location.href='win.html'">
                <div class="flex items-center gap-3 text-gray-200">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-400"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    Bet History
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-500"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </div>
            <div class="menu-item p-4 border-b border-[#1a2942] flex items-center justify-between cursor-pointer" onclick="window.location.href='transactions.html'">
                <div class="flex items-center gap-3 text-gray-200">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-green-400"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                    Transaction History
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-500"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </div>
            <div class="menu-item p-4 border-b border-[#1a2942] flex items-center justify-between cursor-pointer" onclick="openPasswordModal()">
                <div class="flex items-center gap-3 text-gray-200">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-yellow-400"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    Change Password
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-500"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </div>
            <div class="menu-item p-4 flex items-center justify-between cursor-pointer" onclick="logout()">
                <div class="flex items-center gap-3 text-red-400">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    Logout
                </div>
            </div>
        </div>
    </main>

    <!-- Password Modal -->
    <div id="passwordModal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-[#121e36] rounded-xl w-full max-w-sm border border-[#1a2942] shadow-2xl overflow-hidden transform scale-95 transition-transform duration-300">
            <div class="bg-blue-600 p-4 text-center">
                <h3 class="text-white font-bold text-lg">Change Password</h3>
            </div>
            <div class="p-5 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-1">Old Password</label>
                    <input type="password" id="oldPassword" class="w-full bg-[#0a1122] border border-[#1a2942] rounded px-3 py-2 text-white focus:border-blue-500 focus:outline-none placeholder-gray-600" placeholder="Enter current password">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-1">New Password</label>
                    <input type="password" id="newPassword" class="w-full bg-[#0a1122] border border-[#1a2942] rounded px-3 py-2 text-white focus:border-blue-500 focus:outline-none placeholder-gray-600" placeholder="Enter new password">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-1">Confirm New Password</label>
                    <input type="password" id="confirmPassword" class="w-full bg-[#0a1122] border border-[#1a2942] rounded px-3 py-2 text-white focus:border-blue-500 focus:outline-none placeholder-gray-600" placeholder="Confirm new password">
                </div>
                <div class="flex gap-3 pt-2">
                    <button onclick="closePasswordModal()" class="flex-1 py-2 rounded font-bold text-gray-300 bg-[#1a2942]">Cancel</button>
                    <button onclick="changePassword()" class="flex-1 py-2 rounded font-bold text-white bg-blue-600 shadow-[0_0_15px_rgba(37,99,235,0.5)]">Update</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto header-bg flex justify-around items-end pb-2 pt-1 z-40 text-[10px] font-bold shadow-[0_-4px_10px_rgba(0,0,0,0.3)]">
        <a href="index.html" class="flex flex-col items-center nav-inactive w-1/4">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="mb-1"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
            HOME
        </a>
        <a href="win.html" class="flex flex-col items-center nav-inactive w-1/4">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="mb-1"><path d="M2 12h4l3-9 5 18 3-9h5"/></svg>
            WIN
        </a>
        <a href="#" onclick="alert('Aviator Game is locked and Coming Soon!')" class="flex flex-col items-center nav-inactive w-1/4">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="mb-1"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
            BITGAME
        </a>
        <a href="mine.html" class="flex flex-col items-center nav-active w-1/4 relative">
            <div class="nav-circle absolute -top-10 flex items-center justify-center">
                <div class="w-10 h-10 rounded-full bg-[#1a73e8] flex items-center justify-center border-2 border-white text-white shadow-[0_0_10px_rgba(26,115,232,0.8)]">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </div>
            </div>
            <span class="mt-6">MINE</span>
        </a>
    </nav>

    <script>

        // Check if logged in
        const userId = localStorage.getItem('auth_token');
        if (!userId) {
            window.location.href = 'login.html';
        }

        // Setup Socket
        const socket = io({ query: { userId } });

        // Fetch User Info API
        fetch('/api/user', {
            headers: { 'Authorization': userId }
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                const m = data.mobile ? data.mobile.toString() : 'Unknown';
                let masked = m;
                if (m.length >= 10) {
                    masked = m.substring(0,3) + '****' + m.substring(m.length - 3);
                }
                document.getElementById('profile-mobile').innerText = masked;
                const bal = parseFloat(data.balance || 0);
                document.getElementById('profile-balance').innerText = bal.toFixed(2);
                document.getElementById('profile-balance-usd').innerText = '($' + (bal / 100).toFixed(2) + ')';
                
                document.getElementById('profile-name').innerText = data.name || 'User';
                document.getElementById('profile-country').innerText = data.country || 'Sri Lanka 🇱🇰';
                
                if (data.profilePic) {
                    document.getElementById('avatar-placeholder').classList.add('hidden');
                    document.getElementById('avatar-img').src = data.profilePic;
                    document.getElementById('avatar-img').classList.remove('hidden');
                }
                
                document.getElementById('ref-code').innerText = data.referralCode || '------';
                document.getElementById('ref-count').innerText = data.referralCount || 0;
                document.getElementById('ref-earnings').innerText = data.referralEarnings || 0;
                // Store code globally for the copy function
                window.myReferralCode = data.referralCode;
            } else {
                // Invalid token or user not found (database wiped)
                localStorage.removeItem('auth_token');
                window.location.href = 'login.html';
            }
        })
        .catch(err => console.error(err));

        socket.on('update_balance', (balance) => {
            const bal = parseFloat(balance || 0);
            document.getElementById('profile-balance').innerText = bal.toFixed(2);
            document.getElementById('profile-balance-usd').innerText = '($' + (bal / 100).toFixed(2) + ')';
        });

        function uploadAvatar(input) {
            if (!input.files || !input.files[0]) return;
            const file = input.files[0];
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 200;
                    const MAX_HEIGHT = 200;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.7); // Compress to 70% quality JPEG
                    
                    // Show instantly
                    document.getElementById('avatar-placeholder').classList.add('hidden');
                    document.getElementById('avatar-img').src = dataUrl;
                    document.getElementById('avatar-img').classList.remove('hidden');

                    // Send to server
                    fetch('/api/upload-avatar', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': userId
                        },
                        body: JSON.stringify({ image: dataUrl })
                    }).catch(console.error);
                }
            }
        }

        function logout() {
            if(confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('auth_token');
                window.location.href = 'login.html';
            }
        }

        function openPasswordModal() {
            document.getElementById('passwordModal').classList.remove('hidden');
            document.getElementById('oldPassword').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
        }

        function closePasswordModal() {
            document.getElementById('passwordModal').classList.add('hidden');
        }

        async function changePassword() {
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!oldPassword || !newPassword || !confirmPassword) return alert('Please fill all fields');
            if (newPassword !== confirmPassword) return alert('New passwords do not match');
            if (newPassword.length < 6) return alert('Password must be at least 6 characters');

            const token = localStorage.getItem('auth_token');
            try {
                const res = await fetch('/api/user/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': token },
                    body: JSON.stringify({ oldPassword, newPassword })
                });
                const data = await res.json();
                alert(data.message);
                if (data.success) {
                    closePasswordModal();
                }
            } catch (err) {
                alert('Failed to connect to server');
            }
        }
        
        function copyReferral() {
            if (!window.myReferralCode) return;
            const link = window.location.origin + '/register.html?ref=' + window.myReferralCode;
            navigator.clipboard.writeText(link).then(() => {
                alert('Referral link copied! Share it with friends to earn bonus coins.');
            }).catch(() => {
                alert('Failed to copy. Your code is: ' + window.myReferralCode);
            });
        }
    </script>

    <script>
        // Auto-logout after 5 minutes of inactivity
        (function() {
            let inactivityTimer;
            const INACTIVITY_LIMIT = 5 * 60 * 1000; // 5 minutes

            function resetTimer() {
                clearTimeout(inactivityTimer);
                inactivityTimer = setTimeout(logoutUser, INACTIVITY_LIMIT);
            }

            function logoutUser() {
                localStorage.removeItem('userId');
                window.location.href = 'login.html';
            }

            window.onload = resetTimer;
            document.onmousemove = resetTimer;
            document.onkeypress = resetTimer;
            document.onclick = resetTimer;
            document.onscroll = resetTimer;
            document.ontouchstart = resetTimer;
        })();
    </script>
</body>
</html>
