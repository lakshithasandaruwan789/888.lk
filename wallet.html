<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>888.lk - Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #020617; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .brand-font { font-family: 'Outfit', sans-serif; }
        .panel { background-color: #0f172a; border: 1px solid #1e293b; box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.8); }
        .gold-gradient { background: linear-gradient(135deg, #d4af37 0%, #aa8222 50%, #d4af37 100%); }
        .gold-text { background: linear-gradient(135deg, #d4af37 0%, #fef08a 50%, #d4af37 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .glass-header { background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid #1e293b; }
        .nav-item { color: #64748b; transition: all 0.2s; }
        .nav-item:hover, .nav-item.active { color: #d4af37; }
        .input-field { background-color: #020617; border: 1px solid #1e293b; color: white; transition: border-color 0.2s; }
        .input-field:focus { border-color: #d4af37; outline: none; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen relative pb-20 select-none bg-[url('https://www.transparenttextures.com/patterns/dark-matter.png')]">

    <header class="flex items-center justify-between px-5 py-4 sticky top-0 z-40 glass-header">
        <h1 class="font-semibold text-lg tracking-widest text-slate-300 uppercase">Portfolio</h1>
        <a href="index.html" class="flex items-center gap-1 text-xs text-[#d4af37] font-semibold border border-[#d4af37]/30 px-3 py-1.5 rounded bg-[#d4af37]/10">
            <i data-lucide="layout-grid" class="w-3 h-3"></i> Trade
        </a>
    </header>

    <main class="p-4 space-y-5">
        <!-- Balance Card -->
        <div class="panel p-6 rounded-2xl relative overflow-hidden">
            <div class="absolute -right-10 -top-10 w-40 h-40 bg-[#d4af37] opacity-10 rounded-full blur-3xl"></div>
            
            <p class="text-[10px] text-slate-400 uppercase tracking-widest font-semibold mb-2 flex items-center gap-2">
                <i data-lucide="wallet" class="w-3 h-3"></i> Total Balance
            </p>
            <div class="flex items-end gap-2 mb-8 border-b border-[#1e293b] pb-4">
                <span class="text-xl text-[#d4af37] mb-1">LKR</span>
                <span class="font-mono font-bold text-4xl text-white tracking-tight" id="wallet-balance">5,000.00</span>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button onclick="openModal('depositModal')" class="gold-gradient text-[#020617] py-3 rounded-lg font-bold shadow-lg flex items-center justify-center gap-2 uppercase tracking-widest text-xs">
                    <i data-lucide="arrow-down-to-line" class="w-4 h-4"></i> Deposit
                </button>
                <button onclick="openModal('withdrawModal')" class="bg-[#1e293b] text-white border border-[#334155] py-3 rounded-lg font-bold hover:border-[#d4af37] transition flex items-center justify-center gap-2 uppercase tracking-widest text-xs">
                    <i data-lucide="arrow-up-from-line" class="w-4 h-4"></i> Withdraw
                </button>
            </div>
        </div>

        <!-- Action Grid -->
        <div class="grid grid-cols-4 gap-2 panel p-3 rounded-xl">
            <div class="flex flex-col items-center gap-2 cursor-pointer p-2 hover:bg-[#1e293b] rounded-lg transition">
                <i data-lucide="landmark" class="w-6 h-6 text-slate-300"></i>
                <span class="text-[9px] text-slate-400 font-semibold uppercase tracking-widest">Bank</span>
            </div>
            <div class="flex flex-col items-center gap-2 cursor-pointer p-2 hover:bg-[#1e293b] rounded-lg transition">
                <i data-lucide="bitcoin" class="w-6 h-6 text-slate-300"></i>
                <span class="text-[9px] text-slate-400 font-semibold uppercase tracking-widest">Crypto</span>
            </div>
            <div class="flex flex-col items-center gap-2 cursor-pointer p-2 hover:bg-[#1e293b] rounded-lg transition">
                <i data-lucide="gift" class="w-6 h-6 text-slate-300"></i>
                <span class="text-[9px] text-slate-400 font-semibold uppercase tracking-widest">Bonus</span>
            </div>
            <div class="flex flex-col items-center gap-2 cursor-pointer p-2 hover:bg-[#1e293b] rounded-lg transition">
                <i data-lucide="headphones" class="w-6 h-6 text-slate-300"></i>
                <span class="text-[9px] text-slate-400 font-semibold uppercase tracking-widest">Support</span>
            </div>
        </div>

        <!-- Transaction Ledger -->
        <div>
            <h3 class="text-[10px] text-slate-400 uppercase tracking-widest font-semibold border-b border-[#1e293b] pb-2 mb-3 px-1">Ledger</h3>
            
            <div class="space-y-2">
                <div class="panel p-3 rounded-lg flex items-center justify-between border-l-2 border-l-emerald-500">
                    <div class="flex items-center gap-3">
                        <i data-lucide="arrow-down-left" class="w-5 h-5 text-emerald-500"></i>
                        <div>
                            <p class="font-semibold text-slate-200 text-sm">Deposit (Bank)</p>
                            <p class="text-[10px] text-slate-500 font-mono">2026-07-26 14:30</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="font-mono font-bold text-emerald-400 text-sm">+ 10,000.00</p>
                        <p class="text-[9px] text-emerald-500/70 font-semibold uppercase tracking-widest">Settled</p>
                    </div>
                </div>

                <div class="panel p-3 rounded-lg flex items-center justify-between border-l-2 border-l-rose-500">
                    <div class="flex items-center gap-3">
                        <i data-lucide="circle-dot" class="w-5 h-5 text-rose-500"></i>
                        <div>
                            <p class="font-semibold text-slate-200 text-sm">Order (Red)</p>
                            <p class="text-[10px] text-slate-500 font-mono">2026-07-26 15:45</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="font-mono font-bold text-rose-400 text-sm">- 5,000.00</p>
                        <p class="text-[9px] text-slate-500 font-semibold uppercase tracking-widest">Filled</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- DEPOSIT MODAL -->
    <div id="depositModal" class="fixed inset-0 bg-[#020617]/90 items-center justify-center p-4 hidden z-50 backdrop-blur-md">
        <div class="panel border border-[#334155] rounded-xl w-full max-w-sm p-6 relative">
            <button onclick="closeModal('depositModal')" class="absolute top-4 right-4 text-slate-500 hover:text-white transition"><i data-lucide="x" class="w-5 h-5"></i></button>
            <h3 class="text-lg font-semibold text-center mb-6 text-white uppercase tracking-widest border-b border-[#1e293b] pb-4">Deposit Funds</h3>
            
            <div class="space-y-5">
                <div>
                    <label class="block text-[10px] text-slate-400 uppercase tracking-widest font-semibold mb-2">Amount (LKR)</label>
                    <input type="number" placeholder="0.00" class="input-field w-full rounded-lg px-4 py-3 font-mono text-lg" />
                </div>
                <div>
                    <label class="block text-[10px] text-slate-400 uppercase tracking-widest font-semibold mb-2">Method</label>
                    <select class="input-field w-full rounded-lg px-4 py-3 text-sm appearance-none">
                        <option>Bank Transfer (LKR)</option>
                        <option>USDT (TRC-20)</option>
                    </select>
                </div>
                <button class="w-full gold-gradient text-[#020617] py-3 rounded-lg font-bold uppercase tracking-widest text-xs flex items-center justify-center gap-2" onclick="closeModal('depositModal')">
                    <i data-lucide="arrow-right" class="w-4 h-4"></i> Proceed
                </button>
            </div>
        </div>
    </div>

    <!-- WITHDRAW MODAL -->
    <div id="withdrawModal" class="fixed inset-0 bg-[#020617]/90 items-center justify-center p-4 hidden z-50 backdrop-blur-md">
        <div class="panel border border-[#334155] rounded-xl w-full max-w-sm p-6 relative">
            <button onclick="closeModal('withdrawModal')" class="absolute top-4 right-4 text-slate-500 hover:text-white transition"><i data-lucide="x" class="w-5 h-5"></i></button>
            <h3 class="text-lg font-semibold text-center mb-6 text-white uppercase tracking-widest border-b border-[#1e293b] pb-4">Withdraw Funds</h3>
            
            <div class="space-y-5">
                <div>
                    <label class="block text-[10px] text-slate-400 uppercase tracking-widest font-semibold mb-2">Amount (LKR)</label>
                    <input type="number" placeholder="0.00" class="input-field w-full rounded-lg px-4 py-3 font-mono text-lg" />
                    <p class="text-[9px] text-slate-500 mt-1 uppercase tracking-widest">Avail: 5,000.00</p>
                </div>
                <div>
                    <label class="block text-[10px] text-rose-500 uppercase tracking-widest font-semibold mb-2">Security Pin</label>
                    <input type="password" placeholder="Withdraw Password" class="w-full bg-[#020617] border border-rose-900 focus:border-rose-500 outline-none text-white rounded-lg px-4 py-3 text-sm transition" />
                </div>
                <button class="w-full bg-slate-800 text-white border border-[#334155] py-3 rounded-lg font-bold uppercase tracking-widest text-xs flex items-center justify-center gap-2 hover:bg-slate-700 transition" onclick="closeModal('withdrawModal')">
                    Submit Request
                </button>
            </div>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto glass-header border-t border-[#1e293b] flex justify-around py-3 pb-safe z-40">
        <a href="index.html" class="flex flex-col items-center nav-item">
            <i data-lucide="layout-grid" class="w-5 h-5 mb-1"></i><span class="text-[9px] font-semibold tracking-widest uppercase">Trade</span>
        </a>
        <a href="#" class="flex flex-col items-center nav-item">
            <i data-lucide="bar-chart-2" class="w-5 h-5 mb-1"></i><span class="text-[9px] font-semibold tracking-widest uppercase">History</span>
        </a>
        <a href="wallet.html" class="flex flex-col items-center nav-item active">
            <i data-lucide="wallet" class="w-5 h-5 mb-1"></i><span class="text-[9px] font-semibold tracking-widest uppercase">Wallet</span>
        </a>
        <a href="login.html" class="flex flex-col items-center nav-item">
            <i data-lucide="user-circle" class="w-5 h-5 mb-1"></i><span class="text-[9px] font-semibold tracking-widest uppercase">Account</span>
        </a>
    </nav>

    <script>
        lucide.createIcons();
        function openModal(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); }
    </script>
</body>
</html>
