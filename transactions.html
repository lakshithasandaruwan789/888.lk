<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>888.lk - Transaction History</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0b1526; color: #ffffff; font-family: 'Roboto', sans-serif; }
        .header-bg { background-color: #0e1a30; border-bottom: 1px solid #1a2942; }
        .card { background-color: #121e36; border-radius: 8px; border: 1px solid #1a2942; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen relative select-none">
    
    <header class="flex justify-between items-center px-4 py-4 header-bg sticky top-0 z-40">
        <a href="mine.html" class="text-gray-400 hover:text-white">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        </a>
        <div class="text-xl font-bold">Transaction History</div>
        <div class="w-6"></div>
    </header>

    <main class="p-4 pb-20">
        <div id="tx-list" class="space-y-3">
            <div class="text-center text-gray-500 mt-10">Loading...</div>
        </div>
    </main>

    <script>
        const userId = localStorage.getItem('auth_token');
        if (!userId) window.location.href = 'login.html';

        async function fetchTransactions() {
            try {
                const res = await fetch('/api/transactions', {
                    headers: { 'Authorization': userId }
                });
                const data = await res.json();
                
                const list = document.getElementById('tx-list');
                list.innerHTML = '';
                
                if (data.success && data.transactions.length > 0) {
                    data.transactions.forEach(tx => {
                        const date = new Date(tx.createdAt).toLocaleString();
                        const isDeposit = tx.type === 'deposit';
                        
                        let statusColor = 'text-gray-400';
                        if (tx.status === 'pending') statusColor = 'text-yellow-500';
                        if (tx.status === 'approved') statusColor = 'text-green-500';
                        if (tx.status === 'rejected') statusColor = 'text-red-500';
                        
                        const title = isDeposit ? 'Deposit' : 'Withdrawal';
                        const sign = isDeposit ? '+' : '-';
                        const amountColor = isDeposit ? 'text-green-400' : 'text-white';
                        const icon = isDeposit 
                            ? `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-green-400"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>`
                            : `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-blue-400"><line x1="5" y1="12" x2="19" y2="12"></line></svg>`;
                        
                        list.innerHTML += `
                            <div class="card p-4 flex items-center justify-between">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-full bg-[#0e1a30] flex items-center justify-center border border-[#1a2942]">
                                        ${icon}
                                    </div>
                                    <div>
                                        <div class="font-bold text-white">${title}</div>
                                        <div class="text-xs text-gray-500">${date}</div>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <div class="font-bold ${amountColor} text-lg">${sign}$ ${tx.amount.toFixed(2)}</div>
                                    <div class="text-xs font-bold uppercase ${statusColor}">${tx.status}</div>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    list.innerHTML = `<div class="text-center text-gray-500 mt-10">No transactions found.</div>`;
                }
            } catch (e) {
                document.getElementById('tx-list').innerHTML = `<div class="text-center text-red-500 mt-10">Error loading history.</div>`;
            }
        }
        
        fetchTransactions();
    </script>
</body>
</html>
