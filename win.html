<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>888.lk - Wingo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Include Socket.io Client -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0b1526; color: #ffffff; font-family: 'Roboto', sans-serif; }
        .card { background-color: #121e36; border-radius: 8px; }
        .header-bg { background-color: #0e1a30; border-bottom: 1px solid #1a2942; }
        .btn-green { background-color: #28a745; color: white; }
        .btn-violet { background-color: #6f42c1; color: white; }
        .btn-red { background-color: #dc3545; color: white; }
        .num-btn { color: white; font-weight: 700; font-size: 1.25rem; border-radius: 4px; padding: 10px 0; text-align: center; }
        .split-0 { background: linear-gradient(135deg, #dc3545 50%, #6f42c1 50%); }
        .split-5 { background: linear-gradient(135deg, #28a745 50%, #6f42c1 50%); }
        .nav-active { color: #ffffff; }
        .nav-inactive { color: #6c757d; }
        .nav-circle { background-color: #0e1a30; border: 4px solid #0b1526; border-radius: 50%; padding: 10px; margin-top: -25px; }
        
        /* Modal Styles */
        .modal-overlay { background-color: rgba(0,0,0,0.7); }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen relative pb-20 select-none">

    <header class="flex justify-between items-center px-3 py-2 header-bg sticky top-0 z-40">
        <div class="text-2xl font-black text-red-500 italic drop-shadow-md tracking-tighter">
            888<span class="text-yellow-400 text-base font-bold normal-case">.lk</span>
        </div>
        <div class="flex items-center gap-2">
            <div class="flex items-center gap-2 bg-[#1a2942] px-3 py-1 rounded-full">
                <span class="text-yellow-400 text-lg">🪙</span>
                <span id="balance" class="font-bold text-sm">0.00</span>
                <span id="balance-usd" class="font-bold text-xs text-green-400">($0.00)</span>
            </div>
        </div>
    </header>

    <main class="p-3 space-y-4">
        <div class="card p-3 shadow-lg">
            <div class="flex items-center justify-between mb-4">
                <div class="w-8 h-8 rounded-full flex-shrink-0 bg-[#1a2942] flex items-center justify-center text-gray-400 font-bold">?</div>
                <div class="flex gap-2" id="history-circles">
                    <!-- Populated by JS -->
                </div>
                <div class="w-8 h-8 rounded bg-[#1a2942] flex items-center justify-center text-blue-300">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-2 mb-3">
                <button onclick="openBetModal('color', 'Green')" class="btn-green py-2.5 rounded font-medium text-sm shadow">Join Green</button>
                <button onclick="openBetModal('color', 'Violet')" class="btn-violet py-2.5 rounded font-medium text-sm shadow">Join Violet</button>
                <button onclick="openBetModal('color', 'Red')" class="btn-red py-2.5 rounded font-medium text-sm shadow">Join Red</button>
            </div>

            <div class="grid grid-cols-5 gap-2 mb-5">
                <button onclick="openBetModal('number', '0')" class="num-btn split-0 shadow">0</button>
                <button onclick="openBetModal('number', '1')" class="num-btn btn-green shadow">1</button>
                <button onclick="openBetModal('number', '2')" class="num-btn btn-red shadow">2</button>
                <button onclick="openBetModal('number', '3')" class="num-btn btn-green shadow">3</button>
                <button onclick="openBetModal('number', '4')" class="num-btn btn-red shadow">4</button>
                <button onclick="openBetModal('number', '5')" class="num-btn split-5 shadow">5</button>
                <button onclick="openBetModal('number', '6')" class="num-btn btn-red shadow">6</button>
                <button onclick="openBetModal('number', '7')" class="num-btn btn-green shadow">7</button>
                <button onclick="openBetModal('number', '8')" class="num-btn btn-red shadow">8</button>
                <button onclick="openBetModal('number', '9')" class="num-btn btn-green shadow">9</button>
            </div>

            <div class="flex justify-between items-center px-1">
                <div class="flex gap-2 items-center">
                    <span class="text-xs text-gray-400">Period</span>
                    <span id="periodDisplay" class="text-yellow-400 font-bold text-lg font-mono">Loading...</span>
                </div>
                <div class="flex gap-2 items-center">
                    <span class="text-xs text-gray-400">Count Down</span>
                    <span id="timerDisplay" class="text-yellow-400 font-bold text-2xl font-mono">00:00</span>
                </div>
            </div>
        </div>

        <div class="card overflow-hidden mt-4">
            <div class="flex border-b border-[#1a2942]">
                <button id="tab-game-record" onclick="switchTab('game')" class="w-1/2 py-3 text-sm font-bold border-b-2 border-[#2196f3] text-[#2196f3]">Game Record</button>
                <button id="tab-my-record" onclick="switchTab('my')" class="w-1/2 py-3 text-sm font-bold text-gray-400 border-b-2 border-transparent">My Record</button>
            </div>
            
            <!-- Game Record View -->
            <div id="view-game-record">
                <div class="grid grid-cols-4 p-3 text-center border-b border-[#1a2942] text-[11px] font-bold text-gray-300 uppercase">
                    <div>Period</div>
                    <div>Price</div>
                    <div>Number</div>
                    <div>Result</div>
                </div>
                <div id="history-table" class="divide-y divide-[#1a2942] text-center text-sm font-medium">
                    <!-- Populated by JS -->
                </div>
            </div>

            <!-- My Record View -->
            <div id="view-my-record" class="hidden">
                <!-- Header removed for cleaner list view -->
                <div id="my-history-table" class="divide-y divide-[#1a2942]">
                    <!-- Populated by JS -->
                    <div class="p-6 text-center text-gray-500">No bets yet.</div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto header-bg flex justify-around items-end pb-2 pt-1 z-40 text-[10px] font-bold shadow-[0_-4px_10px_rgba(0,0,0,0.3)]">
        <a href="index.html" class="flex flex-col items-center nav-inactive w-1/4">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="mb-1"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
            HOME
        </a>
        <a href="win.html" class="flex flex-col items-center nav-active w-1/4 relative">
            <div class="nav-circle absolute -top-10 flex items-center justify-center">
                <div class="w-10 h-10 rounded-full bg-[#1a73e8] flex items-center justify-center border-2 border-white text-white shadow-[0_0_10px_rgba(26,115,232,0.8)]"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M2.736 10a1 1 0 0 1-.958-1.286l2.1-7A1 1 0 0 1 4.836 1h14.328a1 1 0 0 1 .958.714l2.1 7a1 1 0 0 1-.958 1.286zm17.394 2L12.923 23.364a1.2 1.2 0 0 1-1.846 0L3.87 12z"/></svg></div>
            </div>
            <span class="mt-6">WIN</span>
        </a>
        <a href="#" onclick="alert('Aviator Game is locked and Coming Soon!')" class="flex flex-col items-center nav-inactive w-1/4">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="mb-1"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
            BITGAME
        </a>
        <a href="mine.html" class="flex flex-col items-center nav-inactive w-1/4">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="mb-1"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            MINE
        </a>
    </nav>

    <!-- Bet Modal -->
    <div id="betModal" class="fixed inset-0 modal-overlay flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white text-black rounded-lg w-full max-w-sm p-4 relative">
            <h3 id="modalTitle" class="text-xl font-bold text-center mb-4">Join</h3>
            <div class="flex justify-between mb-4">
                <span>Contract Money</span>
                <div class="flex gap-2">
                    <button id="btn-amt-10" onclick="setAmount(10)" class="border px-2 py-1 rounded border-blue-500 text-blue-500 font-bold amt-btn">10</button>
                    <button id="btn-amt-100" onclick="setAmount(100)" class="border px-2 py-1 rounded amt-btn">100</button>
                    <button id="btn-amt-1000" onclick="setAmount(1000)" class="border px-2 py-1 rounded amt-btn">1000</button>
                </div>
            </div>
            <div class="flex justify-between items-center mb-6">
                <span>Number</span>
                <div class="flex items-center gap-4">
                    <button onclick="adjustQty(-1)" class="w-8 h-8 bg-gray-200 rounded font-bold">-</button>
                    <span id="betQty" class="font-bold text-lg">1</span>
                    <button onclick="adjustQty(1)" class="w-8 h-8 bg-gray-200 rounded font-bold">+</button>
                </div>
            </div>
            <p class="text-center font-bold mb-4">Total contract money is <span id="totalMoney" class="text-orange-500">10</span></p>
            <div class="flex gap-2">
                <button onclick="closeBetModal()" class="w-1/2 py-2 text-gray-500 border rounded">CANCEL</button>
                <button onclick="submitBet()" class="w-1/2 py-2 bg-blue-500 text-white rounded font-bold">CONFIRM</button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded shadow-lg hidden z-50"></div>

    <script>
        // Authentication Check
        const USER_ID = localStorage.getItem('auth_token');
        let clientBettingFrozen = false;
        
        if (!USER_ID) {
            document.getElementById('balance').innerText = '0.00';
        }

        // WebSocket Connection
        const userId = localStorage.getItem('auth_token') || 'guest';
        const socket = io({ query: { userId } });

        socket.on('update_balance', (balance) => {
            const bal = parseFloat(balance);
            document.getElementById('balance').innerText = bal.toFixed(2);
            document.getElementById('balance-usd').innerText = '($' + (bal / 100).toFixed(2) + ')';
        });

        socket.on('time_left', (data) => {
            document.getElementById('periodDisplay').innerText = data.period;
            let mins = Math.floor(data.timeLeft / 60);
            let secs = data.timeLeft % 60;
            document.getElementById('timerDisplay').innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            if(data.timeLeft === 0) closeBetModal();
        });

        socket.on('betting_frozen', (isFrozen) => {
            clientBettingFrozen = isFrozen;
            if (isFrozen) {
                closeBetModal();
                showToast('Betting is now locked for this round!');
            }
        });

        socket.on('history_update', (historyData) => {
            renderHistory(historyData);
        });

        socket.on('my_history_update', (myHistory) => {
            renderMyHistory(myHistory);
        });

        socket.on('period_result', (data) => {
            showToast(`Period ${data.period} Result: ${data.result.colorLabel} ${data.result.number}`);
            setTimeout(() => {
                // Request full history update to refresh
                window.location.reload(); 
            }, 3000);
        });

        socket.on('bet_won', (data) => {
            showToast(`🎉 You Won! Payout: ${data.payout}`);
            const bal = parseFloat(data.newBalance);
            document.getElementById('balance').innerText = bal.toFixed(2);
            document.getElementById('balance-usd').innerText = '($' + (bal / 100).toFixed(2) + ')';
        });

        // UI Logic
        let betType = '';
        let betValue = '';
        let selectedAmount = 10;
        let qty = 1;

        function openBetModal(type, value) {
            if (!USER_ID) {
                window.location.href = 'login.html';
                return;
            }
            if (clientBettingFrozen) {
                showToast('Betting is locked for the last 10 seconds!');
                return;
            }
            betType = type;
            betValue = value;
            document.getElementById('modalTitle').innerText = 'Join ' + value;
            document.getElementById('betModal').classList.remove('hidden');
            setAmount(10);
            qty = 1;
            document.getElementById('betQty').innerText = qty;
        }

        function closeBetModal() {
            document.getElementById('betModal').classList.add('hidden');
        }

        function setAmount(amt) {
            selectedAmount = amt;
            document.getElementById('totalMoney').innerText = selectedAmount * qty;
            
            document.querySelectorAll('.amt-btn').forEach(btn => {
                btn.classList.remove('border-blue-500', 'text-blue-500', 'font-bold');
            });
            const selectedBtn = document.getElementById('btn-amt-' + amt);
            if (selectedBtn) {
                selectedBtn.classList.add('border-blue-500', 'text-blue-500', 'font-bold');
            }
        }

        function adjustQty(val) {
            if(qty + val > 0) qty += val;
            document.getElementById('betQty').innerText = qty;
            setAmount(selectedAmount);
        }

        let isSubmitting = false;

        function submitBet() {
            if (isSubmitting) return; // Prevent spam clicking
            isSubmitting = true;

            const total = selectedAmount * qty;
            
            socket.emit('submit_bet', {
                userId: USER_ID,
                type: betType,
                value: betValue,
                amount: total
            }, (response) => {
                isSubmitting = false; // Release lock
                if(response.success) {
                    const bal = parseFloat(response.newBalance);
                    document.getElementById('balance').innerText = bal.toFixed(2);
                    document.getElementById('balance-usd').innerText = '($' + (bal / 100).toFixed(2) + ')';
                    showToast('Bet placed successfully!');
                    closeBetModal();
                } else {
                    showToast(response.message);
                }
            });
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        function renderHistory(historyList) {
            // Render table
            const table = document.getElementById('history-table');
            const circles = document.getElementById('history-circles');
            if(table) table.innerHTML = '';
            if(circles) circles.innerHTML = '';
            
            if(!historyList) return;

            historyList.slice(0, 10).forEach((item, index) => {
                let cssClass = '';
                if(item.result.colorKey === 'Green') cssClass = 'bg-green-500';
                else if(item.result.colorKey === 'Red') cssClass = 'bg-red-500';
                else if(item.result.colorKey === 'Violet') cssClass = 'bg-purple-500';
                else if(item.result.colorKey === 'RedViolet') cssClass = 'split-0';
                else if(item.result.colorKey === 'GreenViolet') cssClass = 'split-5';

                let numColorClass = [1, 3, 5, 7, 9].includes(item.result.number) ? 'text-green-500' : 'text-red-500';

                // Render Top Circles (only top 7)
                if(circles && index < 7) {
                    circles.innerHTML += `<span class="w-7 h-7 rounded-full flex-shrink-0 ${cssClass} flex items-center justify-center font-bold text-xs shadow-md text-white">${item.result.number}</span>`;
                }

                // Render Table
                if(table) {
                    table.innerHTML += `
                    <div class="grid grid-cols-4 p-3 items-center">
                        <div class="text-gray-300 font-mono">${item.period}</div>
                        <div class="text-gray-300 font-mono">****</div>
                        <div class="font-bold text-base ${numColorClass}">${item.result.number}</div>
                        <div class="flex justify-center"><span class="w-3.5 h-3.5 rounded-full ${cssClass} shadow"></span></div>
                    </div>`;
                }
            });
        }

        function switchTab(tab) {
            const gameTabBtn = document.getElementById('tab-game-record');
            const myTabBtn = document.getElementById('tab-my-record');
            const gameView = document.getElementById('view-game-record');
            const myView = document.getElementById('view-my-record');

            if (tab === 'game') {
                gameTabBtn.className = "w-1/2 py-3 text-sm font-bold border-b-2 border-[#2196f3] text-[#2196f3]";
                myTabBtn.className = "w-1/2 py-3 text-sm font-bold text-gray-400 border-b-2 border-transparent";
                gameView.classList.remove('hidden');
                myView.classList.add('hidden');
            } else {
                myTabBtn.className = "w-1/2 py-3 text-sm font-bold border-b-2 border-[#2196f3] text-[#2196f3]";
                gameTabBtn.className = "w-1/2 py-3 text-sm font-bold text-gray-400 border-b-2 border-transparent";
                myView.classList.remove('hidden');
                gameView.classList.add('hidden');
            }
        }

        function renderMyHistory(historyList) {
            const myTable = document.getElementById('my-history-table');
            myTable.innerHTML = '';
            
            if (!historyList || historyList.length === 0) {
                myTable.innerHTML = '<div class="p-6 text-center text-gray-500">No bets yet.</div>';
                return;
            }

            historyList.slice(0, 20).forEach(bet => {
                let isWin = bet.status.toLowerCase() === 'won';
                let isLoss = bet.status.toLowerCase() === 'lost';
                
                let statusColor = isWin ? 'text-green-500 font-bold uppercase' : (isLoss ? 'text-red-500 font-bold uppercase' : 'text-yellow-500 font-bold uppercase');
                
                // If pending, payout is 0, if lost, payout is 0 but we might want to show -bet.amount. 
                // Since they asked to see clearly if they lost, let's show -amount in red if lost.
                let payoutText = '';
                if (isWin) payoutText = `+$${(bet.payout || 0).toFixed(2)}`;
                else if (isLoss) payoutText = `-$${(bet.amount || 0).toFixed(2)}`;
                else payoutText = 'Pending...';

                let payoutColor = isWin ? 'text-green-400' : (isLoss ? 'text-red-400' : 'text-gray-400');
                
                let selectLabel = bet.type === 'color' ? `<span class="${bet.value === 'Green' ? 'text-green-500' : (bet.value === 'Red' ? 'text-red-500' : 'text-purple-500')} font-bold">${bet.value}</span>` : `<span class="font-bold">#${bet.value}</span>`;

                myTable.innerHTML += `
                    <div class="flex justify-between items-center p-4 hover:bg-[#1a2942] transition bg-[#0d1727] mb-1 rounded">
                        <div class="flex flex-col text-left">
                            <span class="text-xs text-gray-400 font-mono">Period: ${bet.period}</span>
                            <span class="text-sm font-bold mt-1 text-white">Bet $${bet.amount} on ${selectLabel}</span>
                        </div>
                        <div class="flex flex-col text-right">
                            <span class="${statusColor} text-xs tracking-wider">${bet.status}</span>
                            <span class="${payoutColor} font-black text-lg mt-1">${payoutText}</span>
                        </div>
                    </div>
                `;
            });
        }
    </script>

    <script>
        // Auto-logout after 5 minutes of inactivity
        (function() {
            let inactivityTimer;
            const INACTIVITY_LIMIT = 5 * 60 * 1000; // 5 minutes

            function resetTimer() {
                clearTimeout(inactivityTimer);
                inactivityTimer = setTimeout(logoutUser, INACTIVITY_LIMIT);
            }
            function logoutUser() {
                localStorage.removeItem('userId');
                window.location.href = 'login.html';
            }

            window.onload = resetTimer;
            document.onmousemove = resetTimer;
            document.onkeypress = resetTimer;
            document.onclick = resetTimer;
            document.onscroll = resetTimer;
            document.ontouchstart = resetTimer;
        })();
    </script>
</body>
