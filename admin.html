<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>888.lk - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #020617; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .brand-font { font-family: 'Outfit', sans-serif; }
        .panel { background-color: #0f172a; border: 1px solid #1e293b; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); }
        .gold-gradient { background: linear-gradient(135deg, #d4af37 0%, #aa8222 50%, #d4af37 100%); }
        .gold-text { background: linear-gradient(135deg, #d4af37 0%, #fef08a 50%, #d4af37 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="min-h-screen relative p-6 bg-[url('https://www.transparenttextures.com/patterns/dark-matter.png')]">

    <div class="max-w-5xl mx-auto space-y-6">
        
        <header class="flex justify-between items-center panel p-5 rounded-xl">
            <div class="flex items-center gap-4">
                <h1 class="brand-font font-black text-2xl gold-text tracking-widest">888.LK</h1>
                <span class="bg-rose-900/30 text-rose-500 px-3 py-1 rounded border border-rose-900/50 text-[10px] font-bold uppercase tracking-widest flex items-center gap-1">
                    <i data-lucide="shield" class="w-3 h-3"></i> Admin Control
                </span>
            </div>
            <div class="flex items-center gap-6">
                <div class="text-right flex items-center gap-3">
                    <i data-lucide="server" class="w-5 h-5 text-slate-500"></i>
                    <div>
                        <p class="text-[9px] text-slate-500 uppercase tracking-widest font-semibold">Server Sync</p>
                        <p class="font-mono text-xl font-bold text-emerald-500" id="admin-timer">00:30</p>
                    </div>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <div class="md:col-span-2 space-y-6">
                <div class="panel p-6 rounded-xl">
                    <h2 class="text-xs text-slate-400 uppercase tracking-widest font-semibold mb-5 flex items-center gap-2">
                        <i data-lucide="activity" class="w-4 h-4"></i> Live Liability / Exposure 
                    </h2>
                    
                    <div class="grid grid-cols-3 gap-4 mb-6">
                        <div class="bg-[#020617] p-4 rounded-lg border border-emerald-900/50 relative overflow-hidden">
                            <p class="text-emerald-500 font-semibold uppercase tracking-widest text-[9px] mb-1">Total Green Bets</p>
                            <p class="text-xl font-mono font-bold text-slate-200" id="total-green">0.00</p>
                        </div>
                        <div class="bg-[#020617] p-4 rounded-lg border border-purple-900/50 relative overflow-hidden">
                            <p class="text-purple-500 font-semibold uppercase tracking-widest text-[9px] mb-1">Total Violet Bets</p>
                            <p class="text-xl font-mono font-bold text-slate-200" id="total-violet">0.00</p>
                        </div>
                        <div class="bg-[#020617] p-4 rounded-lg border border-rose-900/50 relative overflow-hidden">
                            <p class="text-rose-500 font-semibold uppercase tracking-widest text-[9px] mb-1">Total Red Bets</p>
                            <p class="text-xl font-mono font-bold text-slate-200" id="total-red">0.00</p>
                        </div>
                    </div>

                    <h3 class="text-[10px] text-slate-500 uppercase tracking-widest font-semibold mb-3">Number Exposure</h3>
                    <div class="grid grid-cols-5 gap-2" id="number-exposure">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>

            <div class="space-y-6">
                <div class="panel p-6 rounded-xl border border-[#d4af37]/30">
                    <h2 class="text-xs text-[#d4af37] uppercase tracking-widest font-bold mb-4 flex items-center gap-2">
                        <i data-lucide="cpu" class="w-4 h-4"></i> Algorithm Override
                    </h2>
                    <p class="text-[10px] text-slate-400 mb-5 leading-relaxed">Force a specific winning outcome for the current execution period. This bypasses the auto house-edge logic.</p>
                    
                    <div class="space-y-4">
                        <select id="forceNumber" class="w-full bg-[#020617] border border-[#1e293b] text-slate-300 p-3 rounded-lg text-sm font-semibold focus:border-[#d4af37] focus:outline-none appearance-none">
                            <option value="">Select Target Outcome</option>
                            <option value="0">0 - Violet / Red</option>
                            <option value="1">1 - Green</option>
                            <option value="2">2 - Red</option>
                            <option value="3">3 - Green</option>
                            <option value="4">4 - Red</option>
                            <option value="5">5 - Violet / Green</option>
                            <option value="6">6 - Red</option>
                            <option value="7">7 - Green</option>
                            <option value="8">8 - Red</option>
                            <option value="9">9 - Green</option>
                        </select>
                        
                        <button onclick="forceResult()" class="w-full gold-gradient text-[#020617] py-3 rounded-lg font-bold text-xs uppercase tracking-widest shadow-lg flex items-center justify-center gap-2 hover:opacity-90 transition">
                            <i data-lucide="zap" class="w-4 h-4"></i> Execute Override
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        lucide.createIcons();
        // Socket Connection
        const socket = io();

        socket.on('time_left', (data) => {
            let secs = data.timeLeft % 60;
            document.getElementById('admin-timer').innerText = `00:${secs.toString().padStart(2, '0')}`;
        });

        // Request live update periodically or initially
        setInterval(() => socket.emit('request_admin_data'), 1000);

        socket.on('admin_dashboard_update', (totals) => {
            document.getElementById('total-green').innerText = totals.Green.toFixed(2);
            document.getElementById('total-red').innerText = totals.Red.toFixed(2);
            document.getElementById('total-violet').innerText = totals.Violet.toFixed(2);
            
            let gridHTML = '';
            for(let i = 0; i <= 9; i++) {
                let colorBorder = 'border-slate-800';
                if([1,3,7,9].includes(i)) colorBorder = 'border-emerald-900/50';
                if([2,4,6,8].includes(i)) colorBorder = 'border-rose-900/50';
                if([0,5].includes(i)) colorBorder = 'border-purple-900/50';

                gridHTML += `
                <div class="bg-[#020617] p-3 rounded border ${colorBorder} text-center">
                    <p class="text-lg font-mono font-bold text-slate-300">${i}</p>
                    <p class="text-[10px] text-slate-500 font-bold">${(totals.numbers[i] || 0).toFixed(2)}</p>
                </div>`;
            }
            document.getElementById('number-exposure').innerHTML = gridHTML;
        });

        function forceResult() {
            const num = document.getElementById('forceNumber').value;
            if(num === '') return alert('Select an outcome.');
            
            socket.emit('admin_force_result', { number: parseInt(num) }, (res) => {
                if(res.success) alert(`Override set to ${num}. It will drop at 00:00.`);
            });
        }
    </script>
</body>
</html>
